<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnakeGame.pk — Classic Snake Game</title>
<meta name="description" content="Play the classic Snake game in your browser. Keyboard + mobile controls, high scores. Built by Shahab Khan.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:linear-gradient(135deg,#0D1117,#161B22 60%,#0D1117); color:#E6EDF3; padding:20px; }
  h1 { font-size:1.6rem; margin-bottom:4px; }
  h1 span { color:#3FB950; }
  .tagline { color:#8B949E; font-size:.9rem; margin-bottom:14px; }
  .hud { display:flex; gap:24px; margin-bottom:12px; font-size:1.05rem; }
  .hud b { color:#3FB950; }
  .wrap { position:relative; }
  canvas { background:#0D1117; border:2px solid #30363D; border-radius:14px; display:block;
           width:min(400px,92vw); height:auto; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             background:rgba(13,17,23,.88); border-radius:14px; text-align:center; padding:20px; }
  .overlay.hidden { display:none; }
  .overlay h2 { font-size:1.8rem; margin-bottom:8px; }
  .overlay p { color:#8B949E; margin-bottom:16px; }
  .btn { background:#238636; color:#fff; border:none; border-radius:10px; padding:12px 28px;
         font-size:1rem; font-weight:700; cursor:pointer; transition:.15s; }
  .btn:hover { background:#2EA043; transform:translateY(-1px); }
  .dpad { display:grid; grid-template-columns:repeat(3,56px); grid-template-rows:repeat(3,56px);
          gap:6px; margin-top:16px; justify-content:center; }
  .dpad button { background:#21262D; color:#E6EDF3; border:1px solid #30363D; border-radius:12px;
                 font-size:1.3rem; cursor:pointer; }
  .dpad button:active { background:#30363D; }
  .dpad .up { grid-column:2; grid-row:1; } .dpad .left { grid-column:1; grid-row:2; }
  .dpad .down { grid-column:2; grid-row:3; } .dpad .right { grid-column:3; grid-row:2; }
  .hint { color:#8B949E; font-size:.85rem; margin-top:12px; text-align:center; }
  footer { margin-top:16px; color:#8B949E; font-size:.85rem; text-align:center; }
  footer a { color:#00BFFF; text-decoration:none; }
  @media (min-width:520px){ .dpad { display:none; } }
</style>
</head>
<body>
  <h1>🐍 Snake<span>Game</span>.pk</h1>
  <p class="tagline">The classic snake game — eat, grow, don't crash!</p>

  <div class="hud">
    <div>Score: <b id="score">0</b></div>
    <div>🏆 High Score: <b id="high">0</b></div>
  </div>

  <div class="wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">🐍 Snake Game</h2>
      <p id="ovText">Use arrow keys or WASD to move.<br>Press SPACE or tap Play to start!</p>
      <button class="btn" id="playBtn">▶ Play</button>
    </div>
  </div>

  <div class="dpad">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>

  <p class="hint">⌨️ Arrow keys / WASD to move · SPACE to pause</p>
  <footer>Built with ❤️ by <a href="https://github.com/shahabkhan4636" target="_blank">Shahab Khan</a> · <a href="https://github.com/shahabkhan4636/SnakeGame.pk" target="_blank">View on GitHub</a></footer>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const CELL = 20, COLS = 20, ROWS = 20;
const scoreEl = document.getElementById('score');
const highEl = document.getElementById('high');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovText = document.getElementById('ovText');
const playBtn = document.getElementById('playBtn');

let snake, dir, nextDir, food, score, speed, timer, state;
let high = +(localStorage.getItem('snakeHigh') || 0);
highEl.textContent = high;

function reset(){
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = dir;
  score = 0; speed = 140;
  scoreEl.textContent = 0;
  placeFood();
  draw();
}
function placeFood(){
  while(true){
    food = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)};
    if(!snake.some(s=>s.x===food.x && s.y===food.y)) break;
  }
}
function setDir(x,y){
  if(dir.x===-x && dir.y===-y) return; // no reverse
  nextDir = {x,y};
}
function step(){
  dir = nextDir;
  const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if(head.x<0||head.y<0||head.x>=COLS||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)){
    return gameOver();
  }
  snake.unshift(head);
  if(head.x===food.x && head.y===food.y){
    score += 10; scoreEl.textContent = score;
    if(score>high){ high=score; highEl.textContent=high; localStorage.setItem('snakeHigh',high); }
    if(score%50===0 && speed>60){ speed-=10; restartTimer(); }
    placeFood();
  } else snake.pop();
  draw();
}
function draw(){
  ctx.fillStyle='#0D1117'; ctx.fillRect(0,0,400,400);
  ctx.fillStyle='#161B22';
  for(let x=0;x<COLS;x++) for(let y=0;y<ROWS;y++)
    if((x+y)%2===0) ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
  ctx.fillStyle='#F85149';
  ctx.beginPath(); ctx.arc(food.x*CELL+10,food.y*CELL+10,8,0,Math.PI*2); ctx.fill();
  snake.forEach((s,i)=>{
    ctx.fillStyle = i===0 ? '#3FB950' : '#238636';
    ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);
  });
}
function restartTimer(){ clearInterval(timer); timer=setInterval(step,speed); }
function start(){
  reset(); state='playing';
  overlay.classList.add('hidden');
  restartTimer();
}
function pause(){
  if(state!=='playing') return;
  state='paused'; clearInterval(timer);
  ovTitle.textContent='⏸ Paused'; ovText.innerHTML='Press SPACE or tap Resume.';
  playBtn.textContent='▶ Resume'; overlay.classList.remove('hidden');
}
function gameOver(){
  state='over'; clearInterval(timer);
  ovTitle.textContent='💀 Game Over!';
  ovText.innerHTML=`Your score: <b style="color:#3FB950">${score}</b><br>High score: ${high}`;
  playBtn.textContent='🔄 Play Again'; overlay.classList.remove('hidden');
}
playBtn.onclick = ()=>{ if(state==='paused'){ state='playing'; overlay.classList.add('hidden'); restartTimer(); } else start(); };

const keys = {ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); state==='playing'?pause():(state==='paused'?playBtn.onclick():start()); return; }
  if(keys[e.code]){ e.preventDefault(); setDir(...keys[e.code]); }
});
document.querySelectorAll('.dpad button').forEach(b=>{
  b.addEventListener('touchstart',e=>{ e.preventDefault(); setDir(...keys['Arrow'+b.dataset.dir[0].toUpperCase()+b.dataset.dir.slice(1)]); },{passive:false});
  b.onclick=()=>setDir(...keys['Arrow'+b.dataset.dir[0].toUpperCase()+b.dataset.dir.slice(1)]);
});
reset();
</script>
</body>
</html>
